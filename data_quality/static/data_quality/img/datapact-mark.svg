<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DataPact">
  <title>DataPact</title>
  <!-- Product redesign (Nov 2026): the mark is an answer sheet.
       Graphite sheet so it reads on light and dark tabs alike. -->
  <rect x="4" y="2" width="24" height="28" rx="2" fill="#0e171c"/>
  <!-- The timing track a scanner reads down the sheet's edge. -->
  <rect x="7" y="7"  width="3" height="2" fill="#a3b1b7"/>
  <rect x="7" y="13" width="3" height="2" fill="#a3b1b7"/>
  <rect x="7" y="19" width="3" height="2" fill="#a3b1b7"/>
  <rect x="7" y="25" width="3" height="2" fill="#a3b1b7"/>
  <!-- Two rows answered in line with the key (petrol fill)... -->
  <circle cx="16" cy="8"  r="2.6" fill="#7cc3d6"/>
  <circle cx="23" cy="8"  r="2.1" fill="none" stroke="#a3b1b7" stroke-width="1.3"/>
  <circle cx="16" cy="14" r="2.1" fill="none" stroke="#a3b1b7" stroke-width="1.3"/>
  <circle cx="23" cy="14" r="2.6" fill="#7cc3d6"/>
  <!-- ...and one that departs from it, marked in vermilion. -->
  <circle cx="16" cy="20" r="2.1" fill="none" stroke="#a3b1b7" stroke-width="1.3"/>
  <circle cx="23" cy="20" r="2.1" fill="none" stroke="#a3b1b7" stroke-width="1.3"/>
  <rect x="13" y="24.5" width="13" height="2.5" fill="#e0573f"/>
</svg>
