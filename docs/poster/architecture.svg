<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16202c"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#16202c;stroke-width:2;rx:10}
      .ai{fill:#e8eefc;stroke:#2448b0}
      .db{fill:#f6f7f9}
      .ext{fill:#fbeee5;stroke:#c2662d}
      .t{font-size:17px;font-weight:700;fill:#16202c}
      .s{font-size:13.5px;fill:#5a6672}
      .l{font-size:13px;fill:#16202c;font-style:italic}
      .ln{stroke:#16202c;stroke-width:2;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>

  <!-- user -->
  <rect class="box" x="380" y="14" width="240" height="58" rx="10"/>
  <text class="t" x="500" y="40" text-anchor="middle">User (browser)</text>
  <text class="s" x="500" y="60" text-anchor="middle">signs in: password or Google</text>

  <!-- django -->
  <rect class="box" x="300" y="104" width="400" height="66" rx="10"/>
  <text class="t" x="500" y="131" text-anchor="middle">Django app (PythonAnywhere)</text>
  <text class="s" x="500" y="152" text-anchor="middle">views · login_required · CSRF · templates · Vega-Lite</text>
  <path class="ln" d="M500,72 V102"/>

  <!-- explain path -->
  <text class="t" x="170" y="208" text-anchor="middle">Explain a violation</text>
  <rect class="box" x="40" y="222" width="260" height="62" rx="10"/>
  <text class="t" x="170" y="248" text-anchor="middle">Prompt builder</text>
  <text class="s" x="170" y="268" text-anchor="middle">rule + counts + safe samples, few-shot</text>
  <path class="ln" d="M380,170 C330,190 260,200 220,220"/>

  <rect class="box ai" x="20" y="316" width="140" height="66" rx="10"/>
  <text class="t" x="90" y="343" text-anchor="middle">SmolLM2</text>
  <text class="s" x="90" y="363" text-anchor="middle">1.7B, local GPU</text>
  <rect class="box ext" x="180" y="316" width="140" height="66" rx="10"/>
  <text class="t" x="250" y="343" text-anchor="middle">Groq API</text>
  <text class="s" x="250" y="363" text-anchor="middle">gpt-oss-20b</text>
  <path class="ln" d="M130,284 L100,314"/>
  <path class="ln" d="M210,284 L240,314"/>

  <rect class="box" x="40" y="414" width="260" height="62" rx="10"/>
  <text class="t" x="170" y="440" text-anchor="middle">JSON check</text>
  <text class="s" x="170" y="460" text-anchor="middle">3 fields, cause = data or contract</text>
  <path class="ln" d="M90,382 L140,412"/>
  <path class="ln" d="M250,382 L200,412"/>

  <!-- handbook path -->
  <text class="t" x="830" y="208" text-anchor="middle">Handbook Q&amp;A (RAG)</text>
  <rect class="box ai" x="700" y="222" width="260" height="62" rx="10"/>
  <text class="t" x="830" y="248" text-anchor="middle">MiniLM embeddings</text>
  <text class="s" x="830" y="268" text-anchor="middle">question → vector</text>
  <path class="ln" d="M620,170 C670,190 740,200 780,220"/>

  <rect class="box db" x="700" y="316" width="260" height="66" rx="10"/>
  <text class="t" x="830" y="343" text-anchor="middle">Vector search</text>
  <text class="s" x="830" y="363" text-anchor="middle">9 handbook docs · top 3 · score ≥ 0.3</text>
  <path class="ln" d="M830,284 V314"/>

  <rect class="box ai" x="690" y="414" width="290" height="62" rx="10"/>
  <text class="t" x="835" y="440" text-anchor="middle">SmolLM2 + checks</text>
  <text class="s" x="835" y="460" text-anchor="middle">must cite passages, no made-up numbers</text>
  <path class="ln" d="M830,382 V412"/>

  <!-- back to page -->
  <path class="ln" d="M300,445 C380,445 400,180 440,172"/>
  <path class="ln" d="M690,445 C620,445 600,180 560,172"/>
  <text class="l" x="345" y="300">answer</text>
  <text class="l" x="610" y="300">answer + passages</text>

  <!-- database, logging, dashboard -->
  <rect class="box db" x="320" y="505" width="360" height="72" rx="10"/>
  <text class="t" x="500" y="532" text-anchor="middle">SQLite database</text>
  <text class="s" x="500" y="552" text-anchor="middle">datasets · contracts · runs · violations</text>
  <text class="s" x="500" y="569" text-anchor="middle">AIRequestLog: latency · tokens · cost · outcome</text>
  <path class="ln" d="M500,170 V503"/>
  <path class="ln dash" d="M170,476 C170,530 250,541 318,541"/>
  <path class="ln dash" d="M830,476 C830,530 750,541 682,541"/>
  <text class="l" x="182" y="500">log each request</text>
  <text class="l" x="818" y="500" text-anchor="end">log each request</text>

  <rect class="box" x="360" y="604" width="280" height="50" rx="10"/>
  <text class="t" x="500" y="627" text-anchor="middle">/analytics/ dashboard</text>
  <text class="s" x="500" y="646" text-anchor="middle">performance · behavior · cost</text>
  <path class="ln" d="M500,577 V602"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
