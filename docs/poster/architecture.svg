<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 860" font-family="Inter, Helvetica, Arial, sans-serif">
  <!--
    DataPact architecture for the 22x36 poster. Text is sized to print at about
    15 pt (titles) and 11 pt (details) at the poster's column width. The dashed
    orange area and boxes are local-only: switched off on PythonAnywhere.
  -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16202c"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#16202c;stroke-width:2.5}
      .ai{fill:#e8eefc;stroke:#2448b0}
      .db{fill:#f6f7f9}
      .ext{fill:#fbeee5;stroke:#c2662d}
      .local{stroke:#c2662d;stroke-dasharray:9 6}
      .region{fill:#fff8f1;stroke:#c2662d;stroke-width:2.5;stroke-dasharray:12 8}
      .t{font-size:30px;font-weight:700;fill:#16202c}
      .s{font-size:22px;fill:#3d4955}
      .tag{font-size:18px;font-weight:800;letter-spacing:0.02em;fill:#5a6672}
      .warn{font-size:19px;font-weight:800;letter-spacing:0.02em;fill:#b4531c}
      .ok{font-size:22px;font-weight:700;fill:#2f6b2f}
      .l{font-size:20px;fill:#16202c;font-style:italic}
      .ln{stroke:#16202c;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:7 6}
    </style>
  </defs>

  <!-- user and Django -->
  <rect class="box" x="230" y="6" width="360" height="70" rx="12"/>
  <text class="t" x="410" y="38" text-anchor="middle">User (browser)</text>
  <text class="s" x="410" y="66" text-anchor="middle">password or Google sign-in</text>
  <path class="ln" d="M410,76 V100"/>

  <rect class="box" x="120" y="102" width="580" height="80" rx="12"/>
  <text class="t" x="410" y="136" text-anchor="middle">Django app · PythonAnywhere</text>
  <text class="s" x="410" y="168" text-anchor="middle">views · login · CSRF · templates · Vega-Lite</text>

  <!-- explain a violation (left) -->
  <text class="tag" x="12" y="262">EXPLAIN A VIOLATION</text>
  <path class="ln" d="M300,182 V270"/>
  <rect class="box" x="12" y="272" width="376" height="76" rx="12"/>
  <text class="t" x="200" y="305" text-anchor="middle">Prompt builder</text>
  <text class="s" x="200" y="335" text-anchor="middle">rule + counts + safe samples</text>
  <path class="ln" d="M102,348 V374"/>
  <path class="ln" d="M298,348 V374"/>

  <rect class="box ext" x="12" y="376" width="180" height="92" rx="12"/>
  <text class="t" x="102" y="408" text-anchor="middle">Groq API</text>
  <text class="s" x="102" y="434" text-anchor="middle">gpt-oss-20b</text>
  <text class="ok" x="102" y="459" text-anchor="middle">production</text>
  <rect class="box ai local" x="208" y="376" width="180" height="92" rx="12"/>
  <text class="t" x="298" y="408" text-anchor="middle">SmolLM2</text>
  <text class="s" x="298" y="434" text-anchor="middle">1.7B</text>
  <text class="warn" x="298" y="459" text-anchor="middle">LOCAL ONLY</text>
  <path class="ln" d="M102,468 V494"/>
  <path class="ln" d="M298,468 V494"/>

  <rect class="box" x="12" y="496" width="376" height="76" rx="12"/>
  <text class="t" x="200" y="529" text-anchor="middle">JSON check</text>
  <text class="s" x="200" y="559" text-anchor="middle">cause = data or contract</text>

  <!-- handbook Q&A (right): local only -->
  <rect class="region" x="410" y="240" width="384" height="372" rx="14"/>
  <text class="tag" x="426" y="262">HANDBOOK Q&amp;A (RAG)</text>
  <path class="ln" d="M690,182 V270"/>
  <rect class="box ai" x="426" y="272" width="352" height="76" rx="12"/>
  <text class="t" x="602" y="305" text-anchor="middle">MiniLM embeddings</text>
  <text class="s" x="602" y="335" text-anchor="middle">question → vector</text>
  <path class="ln" d="M602,348 V374"/>
  <rect class="box db" x="426" y="376" width="352" height="92" rx="12"/>
  <text class="t" x="602" y="412" text-anchor="middle">Vector search</text>
  <text class="s" x="602" y="444" text-anchor="middle">9 docs · top 3 · score ≥ 0.3</text>
  <path class="ln" d="M602,468 V494"/>
  <rect class="box ai" x="426" y="496" width="352" height="76" rx="12"/>
  <text class="t" x="602" y="529" text-anchor="middle">SmolLM2 + checks</text>
  <text class="s" x="602" y="559" text-anchor="middle">cite passages · no new numbers</text>
  <text class="warn" x="602" y="600" text-anchor="middle">LOCAL ONLY · off in production</text>

  <!-- storage, logging and the dashboard -->
  <path class="ln" d="M399,182 V648"/>
  <path class="ln dash" d="M200,572 V648"/>
  <path class="ln dash" d="M778,534 C812,534 812,700 682,700"/>
  <text class="l" x="212" y="636">logs each request</text>

  <rect class="box db" x="120" y="650" width="560" height="100" rx="12"/>
  <text class="t" x="400" y="684" text-anchor="middle">SQLite database</text>
  <text class="s" x="400" y="712" text-anchor="middle">datasets · contracts · runs · violations</text>
  <text class="s" x="400" y="738" text-anchor="middle">AIRequestLog: latency · tokens · cost · outcome</text>
  <path class="ln" d="M400,750 V776"/>

  <rect class="box" x="170" y="778" width="460" height="74" rx="12"/>
  <text class="t" x="400" y="810" text-anchor="middle">/analytics/ dashboard</text>
  <text class="s" x="400" y="840" text-anchor="middle">performance · behavior · cost</text>
</svg>
